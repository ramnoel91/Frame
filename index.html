<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frame">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Frame</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffffff'/%3E%3Crect x='12' y='12' width='40' height='40' rx='12' fill='none' stroke='%23C21E66' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23C21E66'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffffff'/%3E%3Crect x='12' y='12' width='40' height='40' rx='12' fill='none' stroke='%23C21E66' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23C21E66'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#C21E66; --accent-2:#E8467F; --ink:#111111; --muted:#5A5A5A; --line:#ECECEC;
  --bg:#FFFFFF; --soft:#F5F4F6; --tint:#FDE2EC; --tint-ink:#9B154F;
  --on-accent:#FFFFFF; --accent-text:#C21E66; --line2:#DADADA; --danger:#B42318; --av-r:32%; --font:'Manrope';
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font),system-ui,-apple-system,sans-serif;overscroll-behavior:none;transition:background-color .2s}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--accent-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}
#top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 12px 8px 16px;border-bottom:1px solid var(--line);min-height:58px;background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.6px}
.logo-mark{width:28px;height:28px;border:3px solid var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center}
.logo-mark i{width:9px;height:9px;border-radius:5px;background:var(--accent)}
.top-title{font-size:20px;font-weight:800}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.icon-btn:active{background:var(--soft)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#nav{display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(8px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg);z-index:5}
#nav .nb{width:56px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink);opacity:.55}
#nav .nb.on{opacity:1}
#nav .create{width:48px;height:40px;border:2px solid var(--ink);border-radius:12px;opacity:1}
.av{border-radius:var(--av-r);object-fit:cover;flex-shrink:0;display:inline-flex}
.av-ini{background:var(--tint);color:var(--tint-ink);font-weight:800;align-items:center;justify-content:center}

/* dark (videos tab) */
#app.dark,#app.dark #nav{background:#000;color:#fff}
#app.dark #nav{border-top-color:#1d1d1d}
#app.dark #nav .nb{color:#fff}
#app.dark #nav .create{border-color:#fff}
#app.dark #top{display:none}

/* moments */
.moments{display:flex;gap:12px;padding:12px 16px 14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.moments::-webkit-scrollbar{display:none}
.mo{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:70px}
.mo-ring{width:68px;height:68px;border-radius:23px;border:3px solid var(--accent);padding:3px}
.mo-ring img{width:100%;height:100%;border-radius:17px;object-fit:cover;display:block}
.mo-add{width:68px;height:68px;border-radius:23px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mo span{font-size:12px;color:var(--ink);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* post */
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px}
.ph .who{flex:1;min-width:0}
.ph .un{font-size:14px;font-weight:700}
.ph .loc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media{position:relative;background:var(--soft);aspect-ratio:4/5;overflow:hidden;user-select:none;-webkit-user-select:none}
.car{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;-webkit-touch-callout:none}
.media video{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots span{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.75)}
.dots span.on{background:var(--accent)}
.count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:12px}
.mute-ind{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);color:#fff;pointer-events:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35));opacity:0}
.burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}40%{transform:translate(-50%,-50%) scale(.95)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.pa{display:flex;align-items:center;padding:4px 8px}
.pa .sp{flex:1}
.pa .liked{color:var(--accent-text)}
.pa .liked svg{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.25)}}
.pm{padding:0 16px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.45}
.pm .lk{font-weight:700}
.pm .cap{margin:0;word-wrap:break-word}
.pm .link{color:var(--muted);text-align:left;font-size:14px}
.pm .time{font-size:12px;color:var(--muted)}
.tag{color:var(--accent-text);font-weight:600;font-size:inherit}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 32px}
.empty .big{width:84px;height:84px;border-radius:28px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.empty h2{margin:0;font-size:22px;font-weight:800}
.empty p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.btn{height:46px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.block{width:100%}
.btn.danger{background:#B42318;color:#fff}

/* explore + grid */
.search{position:sticky;top:0;background:var(--bg);padding:10px 12px;z-index:2}
.search input{width:100%;height:44px;border:none;border-radius:14px;background:var(--soft);padding:0 16px 0 42px}
.search .s-ic{position:absolute;left:26px;top:22px;color:var(--muted);pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.tile{position:relative;aspect-ratio:4/5;background:var(--soft);overflow:hidden;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .badge{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.tile .vid-ph{width:100%;height:100%;background:#26232E}

/* reels */
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.reels::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.slide video{width:100%;height:100%;object-fit:cover;display:block}
.r-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--safe-t)) 10px 10px 16px;color:#fff;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.r-top b{font-size:18px}
.rail{position:absolute;right:6px;bottom:96px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff}
.rail .rb{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.rail .rb .icon-btn{width:48px;height:48px}
.rail .liked{color:var(--accent-2)}
.r-info{position:absolute;left:0;right:64px;bottom:0;padding:16px 16px 18px;color:#fff;display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.r-info .row{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.r-info p{margin:0;font-size:14px;line-height:1.45}
.r-info .tag{color:#fff;text-decoration:underline}
.r-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.r-bar i{display:block;height:100%;width:0;background:#fff}
.reels-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;color:#fff;background:#000}
.reels-empty p{margin:0;color:#C9C9C9;line-height:1.5}
.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:36px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none}
.flash.on{opacity:1}

/* profile */
.cover{height:120px;background-color:var(--accent);background-size:cover;background-position:center}
.prof{padding:0 16px 12px;display:flex;flex-direction:column;gap:12px}
.prof-top{display:flex;align-items:flex-end;gap:16px}
.prof-av{margin-top:-40px;border:4px solid var(--bg);border-radius:var(--av-r);display:inline-flex;background:var(--bg)}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:13px;color:var(--muted)}
.prof .nm{font-weight:800;font-size:16px}
.prof .bio{margin:2px 0 0;font-size:14px;line-height:1.45;white-space:pre-line;color:var(--ink)}
.prof-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.ptabs button{height:46px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.p-empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px}

/* sheets & overlays */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + var(--safe-b));max-height:92dvh;overflow-y:auto;animation:up .25s ease-out;color:var(--ink)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 10px}
.sheet h3{margin:4px 0 12px;font-size:18px;font-weight:800;text-align:center}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border-radius:14px;text-align:left;font-size:16px;font-weight:700}
.opt:active{background:var(--soft)}
.opt .oi{width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.opt.red{color:var(--danger)}
.full{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;max-width:520px;margin:0 auto;animation:fade .15s}
.full-h{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 8px 8px;border-bottom:1px solid var(--line)}
.full-h b{flex:1;font-size:17px;font-weight:800}
.full-b{flex:1;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--bg);width:100%}
.field textarea{resize:none;min-height:90px;line-height:1.45}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.hint{font-size:12px;color:var(--muted)}
.c-list{display:flex;flex-direction:column;gap:14px;padding:4px 0 14px;min-height:120px}
.c-item{display:flex;gap:10px;align-items:flex-start}
.c-item .body{flex:1;font-size:14px;line-height:1.45}
.c-item .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:12px}
.c-item .meta button{font-size:12px;color:var(--muted);font-weight:700}
.c-form{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.c-form input{flex:1;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--bg);padding:0 16px}
.c-form button{font-weight:800;color:var(--accent-text);padding:0 8px;height:44px}
.c-form button:disabled{opacity:.4}

/* story viewer */
#story{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.st-bars{display:flex;gap:4px;padding:calc(10px + var(--safe-t)) 10px 6px}
.st-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.st-bars i{display:block;height:100%;width:0;background:#fff}
.st-h{display:flex;align-items:center;gap:10px;padding:4px 6px 8px 12px}
.st-h .who{flex:1;font-weight:800;font-size:14px}
.st-h .who small{font-weight:500;color:#D0D0D0;margin-left:6px}
.st-img{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.st-img img{max-width:100%;max-height:100%;object-fit:contain}
.st-tap{position:absolute;top:0;bottom:0;width:35%}
.st-tap.l{left:0}.st-tap.r{right:0;width:65%}

#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;z-index:95;background:rgba(255,255,255,.7);background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--tint);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin-right:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.compose-prev{background:var(--soft);aspect-ratio:4/5;max-height:46dvh;width:100%;position:relative;overflow:hidden}
.compose-prev .car img{object-fit:cover}
.compose-prev video{width:100%;height:100%;object-fit:contain;background:#111}
.ed-av{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 18px}
.ed-av button{color:var(--accent-text);font-weight:800;font-size:14px;padding:6px}

/* theme editor */
.th-sec{margin-bottom:20px}
.th-l{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px}
.th-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th-pre{height:54px;border-radius:14px;border:2px solid var(--line2);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:800;font-size:14px}
.th-pre.on{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
.th-dot{width:22px;height:22px;border-radius:11px;flex-shrink:0}
.th-sw{display:flex;flex-wrap:wrap;gap:10px}
.th-c{width:44px;height:44px;border-radius:22px;border:2px solid var(--line2)}
.th-c.on{outline:3px solid var(--ink);outline-offset:2px}
.th-custom{width:44px;height:44px;border-radius:22px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:var(--ink)}
.th-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.th-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.th-o{min-height:66px;border-radius:14px;border:2px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.th-o b{font-size:22px;line-height:1}
.th-o span{font-size:12px;color:var(--muted);font-family:var(--font)}
.th-o.on{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
.th-cover{height:96px;border-radius:14px;background-color:var(--accent);background-size:cover;background-position:center}
.th-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:sticky;bottom:calc(-18px - var(--safe-b));background:var(--bg);padding:10px 0 4px;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view" aria-live="polite"></main>
  <nav id="nav" aria-label="Main">
    <button class="nb" data-action="tab" data-tab="home" aria-label="Home"></button>
    <button class="nb" data-action="tab" data-tab="explore" aria-label="Explore"></button>
    <button class="nb create" data-action="create" aria-label="Create"></button>
    <button class="nb" data-action="tab" data-tab="reels" aria-label="Videos"></button>
    <button class="nb" data-action="tab" data-tab="profile" aria-label="Profile"></button>
  </nav>
</div>
<div id="layer"></div>
<div id="toast" role="status"></div>
<input type="file" id="pickPhotos" accept="image/*" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="pickVideo" accept="video/*" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="pickMoment" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="pickAvatar" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="pickCover" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

/* ---------- icons ---------- */
const sv = (d, o = {}) => `<svg aria-hidden="true" width="${o.s||24}" height="${o.s||24}" viewBox="0 0 24 24" fill="${o.fill||'none'}" stroke="${o.fill?'none':'currentColor'}" stroke-width="${o.w||2}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const HEART = '<path d="M12 20s-7-4.4-9-9a4.7 4.7 0 0 1 9-2.3A4.7 4.7 0 0 1 21 11c-2 4.6-9 9-9 9z"/>';
const I = {
  home: o => sv('<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>', o),
  homeF: () => sv('<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>', {fill:'currentColor'}),

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAY = 864e5;
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return new Date(t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
}
function longAgo(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'Just now';
  if (s < 3600) { const m = Math.floor(s / 60); return m + (m === 1 ? ' minute ago' : ' minutes ago'); }
  if (s < 86400) { const h = Math.floor(s / 3600); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
  if (s < 604800) { const d = Math.floor(s / 86400); return d + (d === 1 ? ' day ago' : ' days ago'); }
  return new Date(t).toLocaleDateString(undefined, {month: 'long', day: 'numeric', year: 'numeric'});
}
function fmt(text) {
  return esc(text).replace(/#([\p{L}\p{N}_]+)/gu, '<button class="tag" data-action="tag" data-tag="$1">#$1</button>').replace(/\n/g, '<br>');
}

/* ---------- storage (IndexedDB with in-memory fallback) ---------- */
let DB = null;
const mem = {posts: new Map(), moments: new Map(), meta: new Map()};
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('frame-app', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('posts', {keyPath: 'id'});
        d.createObjectStore('moments', {keyPath: 'id'});
        d.createObjectStore('meta');
      };
      r.onsuccess = () => { DB = r.result; res(true); };
      r.onerror = () => res(false);
      r.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function tx(name, mode) { const t = DB.transaction(name, mode); return {s: t.objectStore(name), done: new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); })}; }
async function dbAll(name) { if (!DB) return [...mem[name].values()]; return rq(tx(name, 'readonly').s.getAll()); }
async function dbGet(name, key) { if (!DB) return mem[name].get(key); return rq(tx(name, 'readonly').s.get(key)); }
async function dbPut(name, val, key) {
  if (!DB) { mem[name].set(key ?? val.id, val); return; }
  const t = tx(name, 'readwrite'); key === undefined ? t.s.put(val) : t.s.put(val, key); return t.done;
}
async function dbDel(name, key) { if (!DB) { mem[name].delete(key); return; } const t = tx(name, 'readwrite'); t.s.delete(key); return t.done; }
async function dbClear() { for (const n of ['posts', 'moments', 'meta']) { if (!DB) mem[n].clear(); else { const t = tx(n, 'readwrite'); t.s.clear(); await t.done; } } }
async function savePost(p) {
  try { await dbPut('posts', p); }
  catch (e) { toast('Could not save — your phone may be low on space'); throw e; }
}
let askedPersist = false;
function askPersist() { if (askedPersist) return; askedPersist = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }

/* ---------- media helpers ---------- */
const urls = new WeakMap();
function url(blob) { if (!blob) return ''; let u = urls.get(blob); if (!u) { u = URL.createObjectURL(blob); urls.set(blob, u); } return u; }
function loadImg(file) {
  return new Promise((res, rej) => { const im = new Image(); const u = URL.createObjectURL(file); im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); }; im.src = u; });
}
async function compress(file, max = 1440, q = 0.85) {
  let src, w, h;
  try { src = await createImageBitmap(file, {imageOrientation: 'from-image'}); w = src.width; h = src.height; }
  catch (e) { src = await loadImg(file); w = src.naturalWidth; h = src.naturalHeight; }
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  return out || file;
}
function videoPoster(file) {
  return new Promise(res => {
    const v = document.createElement('video'); const u = URL.createObjectURL(file);
    let done = false; const fin = b => { if (done) return; done = true; URL.revokeObjectURL(u); res(b); };
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = u;
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { fin(null); } };
    v.onseeked = () => {
      try {
        const k = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight || 1));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(v.videoWidth * k)); c.height = Math.max(1, Math.round(v.videoHeight * k));
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(b => fin(b), 'image/jpeg', 0.8);
      } catch (e) { fin(null); }
    };
    v.onerror = () => fin(null);
    setTimeout(() => fin(null), 6000);
  });
}

const DEFAULT_THEME = {preset: 'classic', bg: '#FFFFFF', accent: '#C21E66', font: 'Manrope', shape: 'rounded'};
function hex2rgb(h) { h = String(h || '#000').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(a) { return '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function lum(h) { const w = [0.2126, 0.7152, 0.0722]; return hex2rgb(h).reduce((s, v, i) => { v /= 255; return s + w[i] * (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)); }, 0); }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => v + (B[i] - v) * t)); }

function fullTheme(th) { return Object.assign({}, DEFAULT_THEME, th || {}); }
function applyTheme(th) {
  th = fullTheme(th);
  const bg = th.bg, dark = lum(bg) < 0.25, ink = dark ? '#F4F4F6' : '#111111';
  const tint = mix(bg, th.accent, dark ? 0.3 : 0.16);
  const v = {
    '--bg': bg, '--ink': ink,
    '--muted': readable(mix(ink, bg, 0.42), bg, ink, 4.6),
    '--line': mix(bg, ink, 0.1), '--line2': mix(bg, ink, 0.22), '--soft': mix(bg, ink, 0.06),
    '--accent': th.accent, '--accent-text': readable(th.accent, bg, ink, 4.5),
    '--accent-2': readable(th.accent, '#000000', '#FFFFFF', 3),
    '--on-accent': contrast('#FFFFFF', th.accent) >= contrast('#111111', th.accent) ? '#FFFFFF' : '#111111',
    '--tint': tint, '--tint-ink': readable(th.accent, tint, ink, 4.5),
    '--danger': dark ? '#FF8A80' : '#B42318',
    '--font': `'${th.font}'`,

  const r = document.documentElement.style;

  S.themeBg = bg;
  const m = document.querySelector('meta[name=theme-color]'); if (m && S.tab !== 'reels') m.content = bg;
}

/* ---------- video autoplay ---------- */
let io;
function watchVideos() {
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const v = e.target;
      if (e.isIntersecting && e.intersectionRatio >= 0.6) { v.muted = S.muted; const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
      else v.pause();
    });
  }, {threshold: [0, 0.6]});
  $$('video.pv, video.rv').forEach(v => {
    io.observe(v);
    if (v.classList.contains('rv')) v.addEventListener('timeupdate', () => { const bar = v.parentElement.querySelector('.r-bar i'); if (bar && v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%'; });
  });
}
function applyMute() {
  $$('video.pv, video.rv').forEach(v => { v.muted = S.muted; });
  $$('.mute-ind').forEach(e => e.innerHTML = S.muted ? I.muted() : I.sound());
  const tb = $('[data-action="toggle-mute"]'); if (tb) { tb.innerHTML = S.muted ? I.muted({s: 22}) : I.sound({s: 22}); tb.setAttribute('aria-label', S.muted ? 'Turn sound on' : 'Mute'); }
}

  if (p[key] === was) return;

/* share */
async function share(id) {
  const p = byId(id); if (!p) return;
  const blob = p.media[0];
  const ext = (blob.type || '').includes('video') ? (blob.type.split('/')[1] || 'mp4').replace('quicktime', 'mov') : 'jpg';
  const file = new File([blob], `frame-${p.id}.${ext}`, {type: blob.type || 'image/jpeg'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], text: p.caption || ''}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a'); a.href = url(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    toast('Saved to your downloads');
  } catch (e) { toast('Sharing isn’t available here'); }
}

    <div class="ed-av"><span id="edAv">${avatar(84)}</span><button data-action="pick-avatar">Change photo</button></div>
    <div class="field"><label for="pn">Name</label><input id="pn" maxlength="40" value="${esc(p.name)}" placeholder="Your name"></div>
    <div class="field"><label for="pu">Username</label><input id="pu" maxlength="30" value="${esc(p.username)}" autocapitalize="none" autocorrect="off" spellcheck="false"><span class="hint">Letters, numbers, dots and underscores.</span></div>
    <div class="field"><label for="pb">Bio</label><textarea id="pb" maxlength="150" placeholder="A little about you">${esc(p.bio)}</textarea></div>
    <button class="btn block" data-x="ok">${welcome ? 'Get started' : 'Save'}</button>`, {label: 'Edit profile'});
  $('[data-x=ok]', b).onclick = async () => {
    const u = $('#pu').value.toLowerCase().replace(/[^a-z0-9._]/g, '').slice(0, 30);
    p.name = $('#pn').value.trim(); p.username = u || 'you'; p.bio = $('#pb').value.trim();
    if (avatarDraft !== undefined) p.avatar = avatarDraft;
    p.setup = true;
    await dbPut('meta', p, 'profile').catch(() => toast('Could not save profile'));
    closeSheet(); render(true);
  };
}
function settings() {
  const b = sheet(`<h3>Settings</h3>
    <div style="background:var(--soft);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5">
      <b>Storage</b><div id="stUse" style="color:var(--muted)">Checking…</div>
      <div style="color:var(--muted);margin-top:6px">Your posts live only on this phone, in this browser. Clearing your browser data deletes them.</div></div>
    <button class="opt" data-action="theme"><span class="oi">${I.image()}</span><span>Customize theme<small>Colors, font, photo shape and cover</small></span></button>
    <button class="opt red" data-x="clear"><span class="oi">${I.trash()}</span><span>Delete everything<small>Posts, moments and profile</small></span></button>`, {label: 'Settings'});
  (async () => {
    let txt = DB ? 'Saved on this phone' : 'Storage isn’t available in this browser, so posts clear when you close the app.';
    try { if (DB && navigator.storage?.estimate) { const e = await navigator.storage.estimate(); txt = `Using ${(e.usage / 1048576).toFixed(1)} MB`; } } catch (e) {}
    const el = $('#stUse'); if (el) el.textContent = txt;
  })();
  $('[data-x=clear]', b).onclick = () => confirmSheet('Delete everything?', 'All posts, moments and your profile will be erased from this phone.', 'Delete everything', async () => {
    await dbClear().catch(() => {});
    S.posts = []; S.moments = []; S.profile = {name: '', username: 'you', bio: '', avatar: null};
    applyTheme(DEFAULT_THEME); S.tab = 'home'; render(); toast('Everything deleted'); editProfile(true);
  });
}

/* ---------- file pickers ---------- */
function pick(id) { const i = $('#' + id); i.value = ''; i.click(); }
$('#pickPhotos').addEventListener('change', async e => {
  const files = [...e.target.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name)).slice(0, 10);
  if (!files.length) return;
  if (e.target.files.length > 10) toast('Only the first 10 photos were added');
  closeSheet(); busy(true, 'Preparing photos…');
  const media = [];
  for (const f of files) { try { media.push(await compress(f)); } catch (err) {} }
  busy(false);
  if (!media.length) return toast('Those photos couldn’t be opened');
  S.draft = {type: 'photo', media}; openCompose();
});
$('#pickVideo').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  closeSheet();
  if (f.size > 300 * 1048576) return toast('That video is too big (300 MB max)');
  busy(true, 'Preparing video…');
  const poster = await videoPoster(f);
  busy(false);
  S.draft = {type: 'video', media: [f], poster}; openCompose();
});
$('#pickMoment').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  closeSheet(); busy(true, 'Adding moment…');
  try {
    const blob = await compress(f, 1600);
    const m = {id: uid(), blob, created: Date.now()};
    await dbPut('moments', m); S.moments.push(m); askPersist();
    busy(false); if (S.tab !== 'home') S.tab = 'home'; render(); toast('Moment added for 24 hours');
  } catch (err) { busy(false); toast('Couldn’t add that photo'); }
});
$('#pickAvatar').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    avatarDraft = await compress(f, 400, 0.85);
    const el = $('#edAv'); if (el) el.innerHTML = `<img class="av" style="width:84px;height:84px" src="${url(avatarDraft)}" alt="New profile photo">`;
  } catch (err) { toast('Couldn’t open that photo'); }
});

$('#pickCover').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { coverDraft = await compress(f, 1400, 0.85); drawTheme(); } catch (err) { toast('Couldn’t open that photo'); }
});

/* ---------- events ---------- */
const taps = new Map();
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a) {
    case 'tab':
      if (S.tab === el.dataset.tab) { $('#view').scrollTo({top: 0, behavior: 'smooth'}); if (S.tab === 'reels') $('.reels')?.scrollTo({top: 0, behavior: 'smooth'}); return; }
      S.tab = el.dataset.tab; render(); break;
    case 'create': createSheet(); break;
    case 'pick-photos': pick('pickPhotos'); break;
    case 'pick-video': pick('pickVideo'); break;
    case 'pick-moment': pick('pickMoment'); break;
    case 'pick-avatar': pick('pickAvatar'); break;
    case 'publish': publish(); break;
    case 'close-full': closeFull(); break;
    case 'like': toggle(id, 'liked'); break;
    case 'save': toggle(id, 'saved'); break;
    case 'share': share(id); break;
    case 'comments': openComments(id); break;
    case 'post-more': postMore(id); break;
    case 'open': openDetail(id); break;
    case 'go-saved': S.tab = 'profile'; S.ptab = 'saved'; render(); break;
    case 'ptab': S.ptab = el.dataset.t; { const v = $('#view'), y = v.scrollTop; v.innerHTML = viewProfile(); v.scrollTop = y; } break;
    case 'edit-profile': editProfile(false); break;
    case 'settings': settings(); break;
    case 'theme': openTheme(); break;
    case 'th': setTheme(el.dataset.k, el.dataset.v); break;
    case 'pick-cover': pick('pickCover'); break;
    case 'cover-rm': coverDraft = null; drawTheme(); break;
    case 'tag': e.stopPropagation(); closeSheet(); if ($('#full')) closeFull(); S.search = '#' + el.dataset.tag; S.tab = 'explore'; render(); break;
    case 'view-moment': openMoment(+el.dataset.i); break;
    case 'close-moment': closeMoment(); break;
    case 'st-prev': showMoment(st.i - 1); break;
    case 'st-next': showMoment(st.i + 1); break;
    case 'del-moment': {
      const m = S.moments[st.i]; if (!m) return; clearInterval(st.t);
      await dbDel('moments', m.id).catch(() => {});
      S.moments.splice(st.i, 1);
      if (!S.moments.length) closeMoment(); else showMoment(Math.min(st.i, S.moments.length - 1));
      render(true); toast('Moment deleted'); break;
    }
    case 'del-comment': {
      const p = byId(id); if (!p) return;
      p.comments = (p.comments || []).filter(c => c.id !== el.dataset.c);
      await savePost(p).catch(() => {}); $('#clist').innerHTML = commentsHTML(p); refreshPost(id); break;
    }
    case 'toggle-mute': S.muted = !S.muted; applyMute(); break;
    case 'mtap': case 'rtap': {
      // single tap = sound (videos), double tap = like
      const key = id || el.dataset.id, now = Date.now(), last = taps.get(key) || 0;
      const media = a === 'rtap' ? el.parentElement : el;
      if (now - last < 300) {
        taps.delete(key); clearTimeout(media._t);
        burst(media); toggle(key, 'liked', true);
      } else {
        taps.set(key, now);
        const isVid = !!media.querySelector('video');
        if (isVid) media._t = setTimeout(() => {
          S.muted = !S.muted; applyMute();
          const v = media.querySelector('video'); if (v && v.paused) v.play().catch(() => {});
          const fl = media.querySelector('.flash'); if (fl) { fl.innerHTML = S.muted ? I.muted({s: 30}) : I.sound({s: 30}); fl.classList.add('on'); setTimeout(() => fl.classList.remove('on'), 600); }
        }, 300);
      }
      break;
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.search = e.target.value; $('#results').innerHTML = gridHTML(searchHits(), 'No posts match that search.'); }
});
document.addEventListener('scroll', e => {
  const c = e.target; if (!(c instanceof Element) || !c.classList.contains('car')) return;
  const i = Math.round(c.scrollLeft / c.clientWidth), m = c.parentElement;
  $$('.dots span', m).forEach((d, k) => d.classList.toggle('on', k === i));
  const n = $('.count', m); if (n && !n.textContent.includes('photos')) n.textContent = `${i + 1}/${c.children.length}`;
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (st.el) closeMoment(); else if ($('#sheet')) closeSheet(); else if ($('#full')) closeFull();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) $$('video').forEach(v => v.pause()); else watchVideos(); });

/* ---------- boot ---------- */
(async function boot() {
  const ok = await openDB();
  try {
    S.profile = await dbGet('meta', 'profile');
    const posts = await dbAll('posts'); S.posts = posts.sort((a, b) => b.created - a.created);
    const ms = await dbAll('moments'); const now = Date.now();
    S.moments = [];
    for (const m of ms.sort((a, b) => a.created - b.created)) { if (now - m.created > DAY) dbDel('moments', m.id).catch(() => {}); else S.moments.push(m); }
  } catch (e) {}
  if (!S.profile) S.profile = {name: '', username: 'you', bio: '', avatar: null};
  applyTheme(S.profile.theme);
  render();
  if (!ok) toast('Storage isn’t available here, so posts won’t be kept');
  if (!S.profile.setup) editProfile(true);
})();
})();
</script>
</body>
</html>
